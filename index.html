<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D6A4B">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>One for All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a demo guide on the left, one live phone on the right; on phones the guide stacks above the device. */
:root{
  --bg:#E7EEE7; --paper:#F6F8F4; --card:#FFFFFF; --ink:#1B2921; --muted:#5B6C61; --line:#DCE5DD;
  --primary:#2D6A4B; --on-primary:#FFFFFF; --primary-soft:#DCEDE2; --primary-ink:#1F5038;
  --sun:#FFB23E; --on-sun:#3A2600; --sun-soft:#FFF0D6; --sun-ink:#7A4A00;
  --coral:#D5553D; --on-coral:#FFFFFF; --coral-soft:#FBE3DD; --coral-ink:#9A3320;
  --sky:#3F72D6; --sky-soft:#E1E9FA; --sky-ink:#244B98;
  --plum:#8A5BC4; --plum-soft:#EFE6FA; --plum-ink:#5E3A90;
  --frame:#17221C; --scrim:rgba(18,28,22,.45);
  --shadow:0 24px 60px rgba(27,41,33,.20);
  --display:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --paper:#121B16; --card:#1A251F; --ink:#E6EFE9; --muted:#9AAEA2; --line:#2A3831;
    --primary:#6CC497; --on-primary:#0C1A12; --primary-soft:#1E3A2C; --primary-ink:#A9E4C4;
    --sun:#FFC160; --on-sun:#2E1E00; --sun-soft:#3A2E17; --sun-ink:#FFD995;
    --coral:#F0866F; --on-coral:#2A0D07; --coral-soft:#3D221C; --coral-ink:#FFB8A8;
    --sky:#8AACF0; --sky-soft:#1D2A44; --sky-ink:#BCD0FA;
    --plum:#BB97EC; --plum-soft:#2E2340; --plum-ink:#DCC7FA;
    --frame:#040706; --scrim:rgba(0,0,0,.55);
    --shadow:0 24px 60px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --paper:#121B16; --card:#1A251F; --ink:#E6EFE9; --muted:#9AAEA2; --line:#2A3831;
  --primary:#6CC497; --on-primary:#0C1A12; --primary-soft:#1E3A2C; --primary-ink:#A9E4C4;
  --sun:#FFC160; --on-sun:#2E1E00; --sun-soft:#3A2E17; --sun-ink:#FFD995;
  --coral:#F0866F; --on-coral:#2A0D07; --coral-soft:#3D221C; --coral-ink:#FFB8A8;
  --sky:#8AACF0; --sky-soft:#1D2A44; --sky-ink:#BCD0FA;
  --plum:#BB97EC; --plum-soft:#2E2340; --plum-ink:#DCC7FA;
  --frame:#040706; --scrim:rgba(0,0,0,.55);
  --shadow:0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- Guide ---------- */
.stage{display:grid;grid-template-columns:minmax(0,340px) auto;gap:56px;justify-content:center;align-items:start;max-width:1100px;margin:0 auto}
.guide{position:sticky;top:28px;display:flex;flex-direction:column;gap:22px;min-width:0}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:48px;height:48px;flex:none}
.brand h1{font-family:var(--display);font-weight:600;font-size:32px;margin:0;line-height:1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px;font-weight:700}
.lede{margin:0;color:var(--muted);font-size:15px;line-height:1.55}
.g-label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.roles{display:grid;gap:8px}
.role-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--card);border:2px solid transparent;transition:border-color .15s,transform .15s}
.role-btn:hover{transform:translateY(-1px)}
.role-btn[aria-pressed="true"]{border-color:var(--primary)}
.role-btn b{display:block;font-size:15px}
.role-btn small{display:block;color:var(--muted);font-size:13px}
.howto summary{cursor:pointer;list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary .g-label{display:flex;justify-content:space-between}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;width:100%;font-size:14px;line-height:1.4}
.step:hover{background:var(--card)}
.step .dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);background:var(--card)}
.step .dot svg{width:14px;height:14px}
.step.done .dot{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.step.done .t{color:var(--muted)}
.step .t{font-weight:700}
.step em{font-style:normal;color:var(--muted);font-size:12.5px;display:block;font-weight:600}
.g-actions{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{padding:8px 14px;border-radius:999px;background:var(--card);font-weight:800;font-size:14px;border:1px solid var(--line)}
.chip-btn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.fine{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}

/* ---------- Phone ---------- */
.phone{width:390px;height:812px;padding:11px;border-radius:54px;background:var(--frame);box-shadow:var(--shadow);position:relative}
.screen{--scale:1;--u:calc(15px * var(--scale));position:relative;height:100%;border-radius:44px;overflow:hidden;background:var(--paper);font-size:var(--u);line-height:1.45;isolation:isolate}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:var(--frame);z-index:60;pointer-events:none}
#view{display:flex;flex-direction:column;height:100%;min-height:0}
.status{flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.status .sig{display:flex;gap:6px;align-items:center}
.status .sig svg{height:12px;width:auto;fill:currentColor}
.ic{width:1.35em;height:1.35em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.hdr{flex:none;display:flex;align-items:center;gap:12px;padding:6px 18px 12px}
.hdr .ttl{flex:1;min-width:0}
.eyebrow{font-size:calc(var(--u)*.8);color:var(--muted);font-weight:700;display:block}
.hdr h2{margin:0;font-family:var(--display);font-weight:600;font-size:calc(var(--u)*1.6);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.icon-btn{position:relative;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.icon-btn .ic{width:22px;height:22px}
.count{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--coral);color:var(--on-coral);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--paper);line-height:1}
.av-btn{border-radius:50%}

.content{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 26px;display:flex;flex-direction:column;gap:20px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.content>*{flex-shrink:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 10px}
.sec-h h3{margin:0;font-size:calc(var(--u)*1.02);font-weight:800}
.link{color:var(--primary);font-weight:800;font-size:calc(var(--u)*.9)}
.card{background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line)}
.stack{display:grid;gap:10px}
.list{background:var(--card);border-radius:20px;border:1px solid var(--line);overflow:hidden}
.list>.item+.item{border-top:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;width:100%}
.grow{flex:1;min-width:0}
.item b,.ev b{display:block;font-weight:800;line-height:1.3}
.meta{display:block;color:var(--muted);font-size:calc(var(--u)*.84);font-weight:600;line-height:1.35}
.muted{color:var(--muted)}
p{margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:16px;font-weight:800;font-size:var(--u);transition:transform .1s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn.soft{background:var(--primary-soft);color:var(--primary-ink)}
.btn.line{border:2px solid var(--line);background:var(--card)}
.btn.danger{background:var(--coral);color:var(--on-coral)}
.btn.small{min-height:36px;padding:0 13px;border-radius:12px;font-size:calc(var(--u)*.86)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:calc(var(--u)*.76);font-weight:800;white-space:nowrap;line-height:1.4}
.pill .ic{width:1.15em;height:1.15em}
.pill.ok{background:var(--primary-soft);color:var(--primary-ink)}
.pill.warn{background:var(--sun-soft);color:var(--sun-ink)}
.pill.bad{background:var(--coral-soft);color:var(--coral-ink)}
.pill.info{background:var(--sky-soft);color:var(--sky-ink)}
.pill.mute{background:var(--line);color:var(--muted)}

.av{width:2.5em;height:2.5em;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:calc(var(--u)*.82);flex:none;letter-spacing:.02em}
.av.sm{width:2.2em;height:2.2em;font-size:calc(var(--u)*.7)}
.av.lg{width:2.6em;height:2.6em;font-size:calc(var(--u)*1.1)}
.sun-c{background:var(--sun-soft);color:var(--sun-ink)}
.primary-c{background:var(--primary-soft);color:var(--primary-ink)}
.sky-c{background:var(--sky-soft);color:var(--sky-ink)}
.plum-c{background:var(--plum-soft);color:var(--plum-ink)}
.coral-c{background:var(--coral-soft);color:var(--coral-ink)}
.av-stack{display:flex}
.av-stack .av{border:2px solid var(--card);margin-left:-8px}
.av-stack .av:first-child{margin-left:0}

/* Volunteer home */
.cta{background:var(--sun-soft);border-radius:24px;padding:18px;display:grid;gap:10px;position:relative;overflow:hidden}
.cta h3{margin:0;font-family:var(--display);font-weight:600;font-size:calc(var(--u)*1.45);color:var(--ink)}
.cta p{color:var(--ink);opacity:.8;max-width:24ch}
.cta>:not(.art):not(.btn){max-width:calc(100% - 84px)}
.cta .art{position:absolute;right:-14px;top:18px;width:96px;height:96px;border-radius:24px;background:var(--sun);color:var(--on-sun);display:grid;place-items:center;transform:rotate(10deg);opacity:.95}
.cta .art .ic{width:52px;height:52px;stroke-width:1.6}
.cta .btn{justify-self:start;margin-top:4px}
.live{background:var(--primary);color:var(--on-primary);border-radius:24px;padding:18px;position:relative;overflow:hidden;display:grid;gap:6px}
.live::before,.live::after{content:"";position:absolute;border-radius:50%;background:var(--on-primary);opacity:.08}
.live::before{width:180px;height:180px;right:-60px;top:-70px}
.live::after{width:110px;height:110px;right:40px;bottom:-60px}
.live h3{margin:0;font-family:var(--display);font-weight:600;font-size:calc(var(--u)*1.45)}
.live-top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:calc(var(--u)*.86)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 0 var(--sun);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,178,62,.7)}70%{box-shadow:0 0 0 10px rgba(255,178,62,0)}100%{box-shadow:0 0 0 0 rgba(255,178,62,0)}}
.live-sub{display:flex;align-items:center;gap:6px;opacity:.85;font-weight:600;font-size:calc(var(--u)*.88)}
.timer{font-family:var(--display);font-weight:600;font-size:calc(var(--u)*2.7);line-height:1.05;font-variant-numeric:tabular-nums;margin-top:6px}
.skip{font-size:calc(var(--u)*.8);font-weight:700;opacity:.8;text-decoration:underline;text-underline-offset:3px;justify-self:center;margin-top:4px}
.thanks{display:flex;gap:12px;align-items:flex-start;background:var(--primary-soft);color:var(--primary-ink);border-radius:20px;padding:16px}
.thanks .ic{width:28px;height:28px;flex:none}
.thanks b{font-size:calc(var(--u)*1.05)}

.ev{display:flex;gap:12px;align-items:center;padding:12px 14px}
.date{width:3.4em;flex:none;border-radius:14px;background:var(--primary-soft);color:var(--primary-ink);text-align:center;padding:6px 0;line-height:1.1}
.date small{display:block;font-size:calc(var(--u)*.7);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.date b{font-family:var(--display);font-weight:600;font-size:calc(var(--u)*1.35)}
.date.today{background:var(--sun);color:var(--on-sun)}
.ev-side{display:grid;justify-items:end;gap:6px}
.lockline{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:calc(var(--u)*.78);font-weight:700;padding:0 14px 12px 14px;margin-top:-4px}
.lockline .ic{width:1.1em;height:1.1em}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:calc(var(--u)*1.5);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:calc(var(--u)*.76);color:var(--muted);font-weight:700;line-height:1.25;display:block}

/* Impact */
.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;display:grid;gap:4px;position:relative;overflow:hidden}
.hero .big{font-family:var(--display);font-weight:600;font-size:calc(var(--u)*3.4);line-height:1;color:var(--primary);font-variant-numeric:tabular-nums}
.hero .big small{font-size:.4em;color:var(--muted);margin-left:4px}
.bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:124px;padding-top:20px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.bar i{display:block;border-radius:8px 8px 3px 3px;background:var(--primary);min-height:4px}
.bar i.pend{background:var(--sun);border-radius:8px 8px 0 0}
.bar i.pend+i{border-radius:0 0 3px 3px}
.bar span{position:absolute;top:-3px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);transform:translateY(-100%)}
.bar-labels{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:6px}
.bar-labels span{text-align:center;font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:12px;font-size:calc(var(--u)*.76);color:var(--muted);font-weight:700;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bdg{display:grid;justify-items:center;gap:6px;text-align:center;font-size:calc(var(--u)*.74);font-weight:800;line-height:1.2}
.medal{width:3.6em;height:3.6em;border-radius:50%;display:grid;place-items:center;position:relative}
.medal .ic{width:1.7em;height:1.7em}
.bdg small{display:block;color:var(--muted);font-weight:700;font-size:.9em}
.bdg.locked .medal{background:var(--line);color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:100%}
.prog i{display:block;height:100%;background:var(--sun);border-radius:3px}
.prog.green i{background:var(--primary)}

/* Scan */
.scanner{flex:1;position:relative;background:radial-gradient(circle at 50% 38%,#43554A 0%,#1B2620 55%,#0B110E 100%);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#F3F7F4;padding:20px}
.poster{background:#FBFAF5;color:#1B2921;border-radius:12px;padding:14px 14px 12px;width:196px;display:grid;justify-items:center;gap:8px;box-shadow:0 20px 40px rgba(0,0,0,.45);transform:rotate(-4deg);animation:drift 3.5s ease-in-out infinite alternate}
.poster .pt{font-family:var(--display);font-weight:600;font-size:15px;text-align:center;line-height:1.15}
.poster .ps{font-size:11px;font-weight:700;color:#5B6C61;letter-spacing:.04em}
.poster .qrbox{width:130px;height:130px}
@keyframes drift{from{transform:rotate(-4deg) translate(-4px,2px)}to{transform:rotate(-2deg) translate(4px,-3px)}}
.reticle{position:absolute;width:236px;height:290px;top:50%;left:50%;transform:translate(-50%,-58%);pointer-events:none}
.reticle span{position:absolute;width:38px;height:38px;border:4px solid #F3F7F4;transition:border-color .2s}
.reticle .c1{top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.reticle .c2{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.reticle .c3{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.reticle .c4{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.beam{position:absolute;left:8px;right:8px;height:3px;border-radius:2px;background:#FFB23E;box-shadow:0 0 18px 4px rgba(255,178,62,.55);animation:beam 1.6s ease-in-out infinite alternate}
@keyframes beam{from{top:6%}to{top:92%}}
.scanner.found .reticle span{border-color:#FFB23E}
.scanner.found .beam{display:none}
.scan-hint{position:relative;z-index:2;text-align:center;display:grid;gap:4px;max-width:26ch}
.scan-hint b{font-size:calc(var(--u)*1.05)}
.scan-hint span{opacity:.75;font-size:calc(var(--u)*.85);font-weight:600}
.scan-foot{position:relative;z-index:2;display:flex;gap:10px}
.scan-foot button{color:#F3F7F4;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;font-weight:800;font-size:calc(var(--u)*.88)}
.sim{position:absolute;top:12px;left:12px;z-index:2;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.35);padding:4px 9px;border-radius:999px;color:#F3F7F4}

/* Splash */
.splash{position:absolute;inset:0;background:var(--primary);color:var(--on-primary);display:flex;flex-direction:column;padding:48px 28px 34px;overflow:hidden}
.splash .status{padding:4px 2px 0 6px;color:var(--on-primary)}
.splash .blob{position:absolute;border-radius:50%;opacity:.14;background:var(--on-primary)}
.splash .appicon{width:96px;height:96px;border-radius:30px;background:#FFFFFF;display:grid;place-items:center;box-shadow:0 16px 40px rgba(0,0,0,.2);margin-top:60px}
.splash .appicon svg{width:66px;height:66px}
.splash h2{font-family:var(--display);font-weight:600;font-size:calc(var(--u)*2.9);line-height:1;margin:26px 0 8px}
.splash .tag{font-size:calc(var(--u)*1.15);font-weight:700;opacity:.9;max-width:20ch}
.splash .acts{margin-top:auto;display:grid;gap:10px;position:relative}
.splash .btn.out{border:2px solid currentColor;color:var(--on-primary)}
.splash .who{font-size:calc(var(--u)*.82);opacity:.8;text-align:center;font-weight:700;margin-top:6px}

/* Tabbar */
.tabbar{flex:none;display:flex;justify-content:space-around;align-items:flex-end;padding:8px 6px 24px;background:var(--card);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--muted);position:relative;padding-top:4px;text-align:center}
.tab[aria-current="page"]{color:var(--primary)}
.tab .ic{width:24px;height:24px}

function drawQR(el){
  const text = el.dataset.qr, size = +el.dataset.size || 200;
  el.innerHTML = '';
  if (window.QRCode) {
    try { new window.QRCode(el, {text, width:size, height:size, colorDark:'#1B2921', colorLight:'#FFFFFF', correctLevel: window.QRCode.CorrectLevel.M}); el.removeAttribute('title'); return; } catch(e) {}
  }
  // Fallback: a QR-like pattern, so the demo still looks right offline.
  const c = document.createElement('canvas'); const n = 25, px = Math.floor(size/n);
  c.width = c.height = px*n; c.style.width = c.style.height = (px*n)+'px';
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.fillStyle = '#1B2921';
  let seed = [...text].reduce((a,ch)=>a*31+ch.charCodeAt(0)>>>0, 7);
  const rnd = () => (seed = (seed*1103515245+12345)>>>0, (seed>>>16)/65536);
  const finder = (x,y) => { g.fillRect(x*px,y*px,7*px,7*px); g.fillStyle='#fff'; g.fillRect((x+1)*px,(y+1)*px,5*px,5*px); g.fillStyle='#1B2921'; g.fillRect((x+2)*px,(y+2)*px,3*px,3*px); };
  for (let y=0;y<n;y++) for (let x=0;x<n;x++) { const inF = (x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9); if(!inF && rnd()>.52) g.fillRect(x*px,y*px,px,px); }
  finder(0,0); finder(n-7,0); finder(0,n-7);
  el.appendChild(c);
}

function vImpact(){
  const total = approvedTotal(), pend = pendingTotal();
  // index 0 = 7 weeks ago … 7 = this week. Weeks 0–4 come from earlier history; the logs fill weeks 5–7.
  const weeks = [4,1.5,3,2.5,2.5,0,0,0].map(v=>({a:v,p:0}));
  S.logs.forEach(l => { const w = 7 - Math.floor(-l.day/7); if (w>=0 && w<8) { if (l.status==='approved') weeks[w].a += l.hours; else weeks[w].p += l.hours; } });
  const max = Math.max(4, ...weeks.map(w=>w.a+w.p));
  const bars = weeks.map(w => {
    const t = w.a + w.p;
    return `<div class="bar">${t?`<span>${+t.toFixed(2)}</span>`:''}${w.p?`<i class="pend" style="height:${(w.p/max*100).toFixed(1)}px"></i>`:''}<i style="height:${(w.a/max*100).toFixed(1)}px;${w.a?'':'min-height:0'}"></i></div>`;

/* ---------------- render ---------------- */
const SCREENS = {
  vol:{splash:vSplash, home:vHome, impact:vImpact, scan:vScan, news:sNews, chats:sChats, chat:sThread},
  lead:{today:lToday, team:lTeam, news:sNews, chats:sChats, chat:sThread},
  staff:{overview:stOverview, events:stEvents, news:sNews, chats:sChats, chat:sThread}
};
let lastKey = '', scrollMem = {}, scanTimer = null;
function render(){
  const r = S.role, scr = S.screen[r], key = r + ':' + scr + ':' + (S.openChat[r]||'');
  const sc = viewEl.querySelector('[data-scroll]');
  if (sc && lastKey) scrollMem[lastKey] = sc.scrollTop;
  const draft = $('#chatInput') ? $('#chatInput').value : null;
  const focusChat = document.activeElement && document.activeElement.id === 'chatInput';
  viewEl.innerHTML = (SCREENS[r][scr] || SCREENS[r][Object.keys(SCREENS[r])[0]])();
  const sc2 = viewEl.querySelector('[data-scroll]');
  if (sc2) sc2.scrollTop = key === lastKey ? (scrollMem[key]||0) : 0;
  if (key !== lastKey) S.freshNews = scr==='news' ? S.freshNews : null;
  lastKey = key;
  viewEl.querySelectorAll('[data-qr]').forEach(drawQR);
  const th = $('#thread'); if (th) th.scrollTop = th.scrollHeight;
  const ci = $('#chatInput'); if (ci && draft !== null) { ci.value = draft; if (focusChat) ci.focus(); }
  screenEl.style.setProperty('--scale', S.scale);
  if (r==='staff' && scr==='overview' && S.done.approve) S.done.overview = true;
  clearTimeout(scanTimer);
  if (r==='vol' && scr==='scan' && !S.checkin && !S.checkedOut) {
    const g = GEN;
    scanTimer = setTimeout(()=>{
      if (g!==GEN || S.role!=='vol' || S.screen.vol!=='scan') return;
      const s = $('#scanner'); if (s) { s.classList.add('found'); const m = $('#scanMsg'); if (m) m.textContent = 'QR code found'; }
      setTimeout(()=>{ if (g===GEN && S.role==='vol' && S.screen.vol==='scan' && !sheetFn) openSheet(sheetCheckin); }, 550);
    }, 1900);
  }
  renderGuide();
}
function renderGuide(){
  const open = guideEl.querySelector('details') ? guideEl.querySelector('details').open : !window.matchMedia('(max-width: 860px)').matches;
  const doneN = STEPS.filter(s=>S.done[s.k]).length;

    <div class="brand">${LOGO}<div><h1>One for All</h1><p>Volunteer app · clickable prototype</p></div></div>

    <div><p class="g-label">Step into a role</p><div class="roles">${['vol','lead','staff'].map(r=>`<button class="role-btn" data-act="role" data-arg="${r}" aria-pressed="${S.role===r}">${av(ME[r])}<span><b>${ROLE_LABEL[r]}</b><small>${esc(P[ME[r]].name)} · ${r==='vol'?'gives time at sessions':r==='lead'?'runs the Leeds team':'oversees the region'}</small></span></button>`).join('')}</div></div>

/* ---------------- sheet engine ---------------- */
let sheetFn = null;
function openSheet(fn){ sheetFn = fn; drawSheet(); sheetWrap.classList.add('open'); sheetEl.scrollTop = 0; setTimeout(()=>{ const f = sheetEl.querySelector('input:not([type=checkbox]),textarea'); if (f && fn!==sheetCheckout && fn!==sheetProfile) f.focus({preventScroll:true}); }, 60); }
function drawSheet(){ if (!sheetFn) return; const st = sheetEl.scrollTop; sheetEl.innerHTML = '<div class="grab" aria-hidden="true"></div>' + sheetFn(); sheetEl.querySelectorAll('[data-qr]').forEach(drawQR); sheetEl.scrollTop = st; }
function closeSheet(){ sheetWrap.classList.remove('open'); const was = sheetFn; sheetFn = null; if (was===sheetNotifs) { notifSeen = new Set(); } setTimeout(()=>{ if(!sheetFn) sheetEl.innerHTML=''; maybeCelebrate(); }, 220); }
sheetWrap.addEventListener('click', e => { if (e.target === sheetWrap) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key==='Escape' && sheetFn) closeSheet(); });

/* ---------------- notifications ---------------- */
let pushBusy = false, pushTimer = null, pushItem = null;
function notify(role, n, opts={}){
  const item = {id:uid(), read:false, t:new Date(), ...n};
  S.notifs[role].unshift(item);
  if (opts.push !== false) { S.push[role].push(item); if (S.role === role) flushPush(); }
}
function flushPush(){
  if (pushBusy) return;
  const q = S.push[S.role];
  if (!q.length) { maybeCelebrate(); return; }
  const n = q.shift(); pushBusy = true; pushItem = n;
  pushEl.innerHTML = `<span class="pi ${n.urgent?'urgent':''}">${ic(n.icon)}</span><span class="grow"><span class="app">One for All · now</span><b>${esc(n.title)}</b><p>${esc(n.body)}</p></span>`;
  requestAnimationFrame(()=>pushEl.classList.add('show'));
  const g = GEN;
  pushTimer = setTimeout(()=>hidePush(g), 3600);
}
function hidePush(g){
  pushEl.classList.remove('show'); clearTimeout(pushTimer);
  setTimeout(()=>{ if (g!==undefined && g!==GEN) return; pushBusy = false; pushItem = null; flushPush(); }, 420);
}
pushEl.addEventListener('click', ()=>{ if (pushItem) { const n = pushItem; n.read = true; navigate(n.go); hidePush(GEN); } });
function navigate(go){
  if (!go) return;
  if (sheetFn) { sheetWrap.classList.remove('open'); sheetFn = null; sheetEl.innerHTML=''; }
  if (go.startsWith('chat:')) { S.openChat[S.role] = go.slice(5); S.screen[S.role] = 'chat'; }
  else if (SCREENS[S.role][go]) { S.screen[S.role] = go; if (go!=='chat') S.openChat[S.role] = null; }
  if (S.role==='vol' && go==='impact' && S.badge50) S.done.badge = true;
  render();
}
function maybeCelebrate(){
  if (S.role==='vol' && S.celebrate && !pushBusy && !sheetFn) {
    S.celebrate = false; S.done.badge = true; openSheet(sheetCelebrate); confetti(); renderGuide();
  }
}
let snackT = null;
function snack(t){ snackEl.textContent = t; snackEl.classList.add('show'); clearTimeout(snackT); snackT = setTimeout(()=>snackEl.classList.remove('show'), 2600); }

/* ---------------- confetti ---------------- */
function confetti(){
  if (REDUCED) return;
  const c = $('#confetti'), g = c.getContext('2d');
  const w = c.width = screenEl.clientWidth, h = c.height = screenEl.clientHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--sun','--coral','--primary','--sky','--plum'].map(v=>cs.getPropertyValue(v).trim());
  const parts = Array.from({length:90}, ()=>({x:w/2+(Math.random()-.5)*80, y:h*.38, vx:(Math.random()-.5)*9, vy:-Math.random()*10-4, r:Math.random()*6+4, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, s:Math.random()>.5}));
  let f = 0;
  (function tick(){
    g.clearRect(0,0,w,h); f++;
    parts.forEach(p=>{ p.vy += .32; p.x += p.vx; p.y += p.vy; p.a += .15; g.save(); g.translate(p.x,p.y); g.rotate(p.a); g.fillStyle = p.c; if (p.s) g.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); else { g.beginPath(); g.arc(0,0,p.r/2.4,0,7); g.fill(); } g.restore(); });
    if (f < 120) requestAnimationFrame(tick); else g.clearRect(0,0,w,h);
  })();
}

/* ---------------- chat logic ---------------- */
const replyIdx = {g1:0,g2:0,g3:0};
function sendMsg(gid, text){
  text = text.trim(); if (!text) return;
  const r = S.role, g = G(gid), who = ME[r];
  g.msgs.push({from:who, text, t:new Date()});
  S.lastRead[r][gid] = g.msgs.length;
  ['vol','lead','staff'].forEach(o => { if (o!==r && VISIBLE[o].includes(gid)) notify(o, {icon:'chat', title:`${P[who].short} in ${g.name}`, body:text, go:'chat:'+gid}); });
  S.done.talk = true;
  render();
  const pool = REPLIES[gid].filter(([w]) => w !== who && w !== ME[r]);
  const [rw, rt] = pool[replyIdx[gid]++ % pool.length];
  const gen = GEN;
  setTimeout(()=>{ if (gen!==GEN) return; S.typing = {gid, who:rw}; render(); }, 700);
  setTimeout(()=>{ if (gen!==GEN) return; S.typing = null; g.msgs.push({from:rw, text:rt, t:new Date()}); if (S.screen[S.role]==='chat' && S.openChat[S.role]===gid) S.lastRead[S.role][gid] = g.msgs.length; render(); }, 2300);
}

/* ---------------- actions ---------------- */
const A = {
  role(r){
    if (S.role===r) return;
    if (sheetFn) { sheetWrap.classList.remove('open'); sheetFn = null; sheetEl.innerHTML=''; }
    clearTimeout(pushTimer); pushEl.classList.remove('show'); pushBusy = false; pushItem = null;
    S.role = r; render();
    setTimeout(flushPush, 350);
  },
  go(k){
    if (S.role==='vol' && k==='impact' && S.badge50) S.done.badge = true;
    S.screen[S.role] = k; S.openChat[S.role] = null; render();
  },
  back(){ S.screen[S.role] = 'chats'; S.openChat[S.role] = null; render(); },
  openChat(gid){ S.openChat[S.role] = gid; S.screen[S.role] = 'chat'; render(); },
  quick(t){ sendMsg(S.openChat[S.role], t); },
  step(i){
    const s = STEPS[+i];
    if (s.role && s.role !== S.role) A.role(s.role);
    if (SCREENS[S.role][s.go]) { S.screen[S.role] = s.go; S.openChat[S.role] = null; }
    if (s.k==='badge' && S.badge50) S.done.badge = true;
    render();
  },
  checkin(){
    const ev = E('e1');
    S.checkin = {start:Date.now(), inAt:hm(new Date())};
    S.roster.maya = {in:S.checkin.inAt};
    S.done.checkin = true;
    closeSheet(); S.screen.vol = 'home';
    const here = ev.team.filter(w=>S.roster[w] && S.roster[w].in && !S.roster[w].out).length;
    notify('lead', {icon:'check', title:'Maya checked in', body:`${ev.name} at ${S.checkin.inAt}. ${here} of ${ev.need} volunteers are here.`, go:'today'});
    render(); snack('You’re checked in. Have a lovely session!');
    const gen = GEN;
    setTimeout(()=>{
      if (gen!==GEN || !S.checkin) return;
      const g = G('g1'); g.msgs.push({from:'daniel', text:'Welcome, Maya! Tea’s on in Room 2.', t:new Date()});
      S.lastRead.lead.g1 = g.msgs.length;
      notify('vol', {icon:'chat', title:'Daniel in Memory Café · Leeds', body:'Welcome, Maya! Tea’s on in Room 2.', go:'chat:g1'});
      render();
    }, 3800);
  },
  skip(){ if (!S.checkin) return; S.checkin.start = Date.now() - (2*3600 + 28*60)*1000; render(); snack('Skipped ahead to the end of the session'); },
  checkoutOpen(){
    if (!S.checkin) return;
    const hrs = Math.max(0.25, Math.round((Date.now()-S.checkin.start)/3600000*4)/4);
    CS = {hours:hrs, reach:12, feel:'great', concern:false, concernText:'', debrief:false};
    openSheet(sheetCheckout);
  },
  cs(arg){ const [k,d] = arg.split(':'); if (k==='hours') CS.hours = Math.min(12, Math.max(0.25, CS.hours + +d)); else CS.reach = Math.max(0, Math.min(200, CS.reach + +d)); drawSheet(); },
  feel(k){ CS.feel = k; if (k!=='tough') CS.debrief = false; drawSheet(); },
  submitCheckout(){
    const ev = E('e1');
    if (CS.concern && !CS.concernText.trim()) { const t = $('#concernText'); if (t) { t.focus(); t.placeholder = 'Please add a few words so your Team Lead knows what to do.'; } return; }
    S.logs.unshift({id:'lnew', day:0, event:ev.name, hours:CS.hours, reach:CS.reach, status:'pending'});
    S.approvals.unshift({id:'anew', who:'maya', event:ev.name, day:0, hours:CS.hours, reach:CS.reach, feel:CS.feel, logId:'lnew', concern:CS.concern});
    S.roster.maya = {in:S.checkin.inAt, out:hm(new Date()), hours:CS.hours};
    S.checkin = null; S.checkedOut = true; S.done.checkout = true;
    notify('lead', {icon:'clock', title:'Hours to approve', body:`Maya checked out of ${ev.name}: ${fmtH(CS.hours)}, ${CS.reach} people supported.`, go:'today'});
    if (CS.concern) {
      const al = {id:uid(), from:'maya', event:ev.name, text:CS.concernText.trim(), t:new Date(), resolved:false};
      S.alerts.unshift(al);
      notify('lead', {icon:'shield', urgent:true, title:'Wellbeing concern raised', body:`Maya at ${ev.name}: ${al.text}`, go:'today'});
      notify('staff', {icon:'shield', urgent:true, title:'Wellbeing concern raised', body:`Maya at ${ev.name}: ${al.text}`, go:'overview'});
    }
    if (CS.feel==='tough' && CS.debrief) { S.debriefs.push({id:uid(), who:'maya', event:ev.name, booked:false}); notify('staff', {icon:'heart', title:'Debrief requested', body:`Maya asked for a 15-minute chat after a tough ${ev.name}.`, go:'overview'}); }
    closeSheet(); S.screen.vol = 'home'; render();
    snack(CS.concern ? 'Checked out. Daniel and Priya have your report.' : 'Checked out. Your hours are with Daniel for approval.');
  },
  signUp(eid){
    const e = E(eid); if (!e || e.team.includes('maya')) return;
    e.team.push('maya'); e.joined = true;
    notify('lead', {icon:'people', title:'New sign-up', body:`Maya signed up for ${e.name} (${e.team.length} of ${e.need}).`, go:'today'});
    render(); snack(`You’re signed up for ${e.name}. We’ll remind you the day before.`);
  },
  like(id){ S.liked[id] = !S.liked[id]; render(); },
  filter(t){ S.newsFilter = t; render(); },
  compose(){ openSheet(sheetCompose); },
  bell(){
    const list = S.notifs[S.role]; notifSeen = new Set(list.filter(n=>!n.read).map(n=>n.id));
    list.forEach(n => n.read = true);
    openSheet(sheetNotifs); render();
  },
  notifGo(id){ const n = S.notifs[S.role].find(x=>x.id===id); closeSheet(); if (n) navigate(n.go); },
  profile(){ openSheet(sheetProfile); },
  scaleToggle(){ S.scale = S.scale>1 ? 1 : 1.15; render(); drawSheet(); },
  showQR(eid){ openSheet(()=>sheetQR(eid)); },
  approve(id, silent){
    const a = S.approvals.find(x=>x.id===id); if (!a || a.state) return;
    a.state = 'approved';
    S.extra.hours += a.hours; S.extra.sessions += 1; S.extra.reach += a.reach;
    if (a.who==='maya') {
      const l = S.logs.find(x=>x.id===a.logId); if (l) l.status = 'approved';
      S.done.approve = true;
      notify('vol', {icon:'check', title:'Hours approved', body:`Daniel approved ${fmtH(a.hours)} for ${a.event}. Thank you!`, go:'impact'});
      if (!S.badge50 && approvedTotal() >= 50) { S.badge50 = true; S.celebrate = true; notify('vol', {icon:'star', title:'Badge unlocked: 50 hours', body:'You’ve given 50 hours to people affected by dementia.', go:'impact'}, {push:false}); }
    }
    if (!silent) { render(); snack(`Approved ${fmtH(a.hours)} for ${P[a.who].short}`); }
  },
  approveAll(){ const p = S.approvals.filter(a=>!a.state); p.forEach(a=>A.approve(a.id, true)); render(); snack(`Approved ${p.length} hour logs`); },
  query(id){ const a = S.approvals.find(x=>x.id===id); if (!a) return; a.state = 'queried'; if (a.who==='maya') notify('vol', {icon:'clock', title:'Please check your hours', body:`Daniel asked you to check ${fmtH(a.hours)} for ${a.event}.`, go:'impact'}); render(); snack(`Asked ${P[a.who].short} to check the hours`); },
  resolve(id){ const a = S.alerts.find(x=>x.id===id); if (a) a.resolved = true; render(); snack('Marked as handled and logged for the safeguarding record'); },
  callAlert(){ snack('Calling Maya… (demo)'); },
  bookDebrief(id){ const d = S.debriefs.find(x=>x.id===id); if (d) d.booked = true; notify('vol', {icon:'heart', title:'Debrief booked', body:'Priya will call you tomorrow at 10:00. Take care of yourself.', go:'home'}); render(); snack('Call booked. Maya has been told.'); },
  nudge(w){ S.nudged[w] = true; render(); snack(`Reminder sent to ${P[w].short}`); },
  remind(){ S.remindersSent = true; notify('lead', {icon:'shield', title:'DBS reminders sent', body:'Priya reminded 7 volunteers to renew, including Tom in your team.', go:'team'}); render(); snack('Reminders sent to 7 volunteers'); },
  shiftAlert(){
    S.shiftAlertSent = true;
    const forMaya = S.events.filter(e=>e.day>0 && e.team.length<e.need && !e.team.includes('maya') && canDo(e.kind));
    if (forMaya.length) notify('vol', {icon:'cal', title:'A shift near you needs help', body:`${forMaya[0].name} ${when(forMaya[0].day)} at ${forMaya[0].start}. Tap to sign up.`, go:'home'});
    render(); snack('Alert sent to trained volunteers nearby');
  },
  newEvent(){ openSheet(sheetNewEvent); },
  cert(){ snack('Request sent. Priya will email your certificate.'); },
  shareBadge(){ closeSheet(); S.screen.vol = 'chat'; S.openChat.vol = 'g1'; sendMsg('g1', 'I just reached 50 volunteering hours!'); },
  closeSheet(){ closeSheet(); },
  codeOpen(){ codeErr = ''; openSheet(sheetCode); },
  reset(){
    GEN++; clearTimeout(scanTimer); clearTimeout(pushTimer);
    if (sheetFn) { sheetWrap.classList.remove('open'); sheetFn = null; sheetEl.innerHTML = ''; }
    pushEl.classList.remove('show'); pushBusy = false; pushItem = null; lastKpi = null;
    S = initState(); lastKey = ''; scrollMem = {}; render(); snack('Demo reset');
  }
};
const FORMS = {
  chat(fd, f){ const t = fd.get('text') || ''; f.querySelector('input').value = ''; sendMsg(S.openChat[S.role], t); },
  code(fd){
    const c = String(fd.get('code')||'').trim().toUpperCase().replace(/\s+/g,'');
    const e = S.events.find(x => x.code === c);
    if (!c) codeErr = 'Type the code printed under the QR code.';
    else if (!e) codeErr = 'We couldn’t find that code. Check the poster and try again.';
    else if (e.day !== 0) codeErr = `That code is for ${e.name} ${when(e.day)} at ${e.start}. Check-in opens 30 minutes before it starts.`;
    else { codeErr = ''; sheetFn = sheetCheckin; drawSheet(); return; }
    drawSheet(); const i = $('#codeIn'); if (i) { i.value = c; i.focus(); }
  },
  compose(fd){
    const r = S.role, n = {id:uid(), by:ME[r], tag:fd.get('tag'), t:new Date(), title:String(fd.get('title')).trim(), body:String(fd.get('body')).trim(), likes:0, audience:fd.get('audience')};
    if (!n.title || !n.body) return;
    S.news.unshift(n); S.freshNews = n.id; S.newsFilter = 'All'; S.done.talk = true;
    const push = fd.get('push') === 'on';
    ['vol','lead','staff'].forEach(o => { if (o!==r && !(n.audience==='Team Leads · Yorkshire' && o==='vol')) notify(o, {icon:'mega', title:`New from ${P[ME[r]].short}`, body:n.title, go:'news'}, {push}); });
    closeSheet(); render(); snack(push ? 'Posted and sent as a notification' : 'Posted to News');
  },
  event(fd){
    const day = +fd.get('day'), start = String(fd.get('start')), kind = String(fd.get('kind'));
    const [h, m] = start.split(':').map(Number), endD = new Date(2000,0,1,h,m+90);
    const prefix = String(fd.get('name')).replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase() || 'EV';
    const e = {id:uid(), name:String(fd.get('name')).trim()||'New event', kind, venue:String(fd.get('venue')), day, start, end:hm(endD), hours:1.5, code:`${prefix}-LDS-${1000+Math.floor(Math.random()*9000)}`, need:+fd.get('need'), team:[]};
    S.events.push(e);
    const alert = fd.get('alert') === 'on';
    if (alert && canDo(kind)) notify('vol', {icon:'cal', title:'New shift near you', body:`${e.name} ${when(day)} at ${start}. ${e.need} volunteers needed.`, go:'home'});
    closeSheet(); render();
    setTimeout(()=>{ openSheet(()=>sheetQR(e.id)); snack(alert ? (canDo(kind) ? 'Event created. Matching volunteers alerted.' : 'Event created. Only peer-support-trained volunteers were alerted.') : 'Event created'); }, 260);
  }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = A[b.dataset.act]; if (fn) { e.preventDefault(); fn(b.dataset.arg); }
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(new FormData(f), f); });
document.addEventListener('change', e => {
  const m = e.target.dataset && e.target.dataset.model; if (!m || e.target.type !== 'checkbox') return;
  if (m==='scale') { S.scale = e.target.checked ? 1.15 : 1; render(); drawSheet(); return; }
  if (CS && m in CS) { CS[m] = e.target.checked; drawSheet(); if (m==='concern' && CS.concern) { const t = $('#concernText'); if (t) t.focus(); } }
});
document.addEventListener('input', e => { const m = e.target.dataset && e.target.dataset.model; if (m==='concernText' && CS) CS.concernText = e.target.value; });

setInterval(()=>{
  document.querySelectorAll('[data-timer]').forEach(el => el.textContent = elapsed());
  document.querySelectorAll('[data-clock]').forEach(el => el.textContent = hm(new Date()));
}, 1000);

render();
})();
</script>
